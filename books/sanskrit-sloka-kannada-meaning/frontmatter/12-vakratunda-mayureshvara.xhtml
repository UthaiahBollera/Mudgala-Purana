<html xmlns="http://www.w3.org/1999/xhtml" lang="kn" xml:lang="kn"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>ಶ್ರೀ ವಕ್ರತುಂಡ ಮಯೂರೇಶ್ವರ</title><link rel="stylesheet" href="../styles/book.css"/></head><body><main class="frontmatter" id="fm-vakratunda-mayureshvara" data-source-pdf-page="12"><figure class="source-facsimile"><img src="../assets/source-pages/pdf-12.jpg" alt="ಮೂಲ PDF ಪುಟ 12 ಪೂರ್ಣ ಪ್ರತಿಚಿತ್ರ"/></figure><p>ಖಂಡ १</p><p class="caption">ಶ್ರೀ ವಕ್ರತುಂಡ ಮಯೂರೇಶ್ವರ, ದಂಡಕಾರಣ್ಯ, ಢೇಂಪವಾಡ.&#160;<abbr class="reading-uncertain" title="ಮೂಲದ ಓದು ಅಥವಾ ಅರ್ಥ ದೃಢೀಕರಣ ಬಾಕಿ">†</abbr></p><p class="caption">ಶ್ರೀ ವಕ್ರತುಂಡ ಮಯೂರೇಶ್ವರನಿಗೆ ನಮಸ್ಕಾರ.</p></main></body></html>
