<!doctype html>
<html lang="kn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ಮುದ್ಗಲ ಪುರಾಣ</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #30201e; }
    .book { display: grid; gap: 32px; padding: 28px 18px 50px; }
    .page { width: min(740px, 100%); aspect-ratio: 210 / 297; margin: auto; background: #f4ead6; box-shadow: 0 16px 40px #140b0b88; }
    .cover { width: min(620px, 100%); aspect-ratio: 1024 / 1536; background: #4c1420; box-shadow: none; }
    .cover img { display: block; width: 100%; height: 100%; object-fit: contain; }
    @media (max-width: 600px) { .book { padding: 16px 9px 32px; gap: 22px; } }
    @page { size: A4 portrait; margin: 0; }
    @media print {
      body { background: #f4ead6; }
      .book { display: block; padding: 0; }
      .page { width: 210mm; height: 297mm; margin: 0; box-shadow: none; break-after: page; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .page:last-child { break-after: auto; }
    }
  </style>
</head>
<body>
  <main class="book">
    <section class="page cover" id="cover" aria-label="ಮುದ್ಗಲ ಪುರಾಣ">
      <img src="assets/mudgala-front-cover-kannada-v5.png" width="1024" height="1536" alt="ಮುದ್ಗಲ ಪುರಾಣ" />
    </section>
    <!-- Reserved for Sanskrit sloka and Kannada meaning. Script choice is pending. -->
    <section class="page" id="content" aria-label="Blank content page"></section>
  </main>
</body>
</html>
