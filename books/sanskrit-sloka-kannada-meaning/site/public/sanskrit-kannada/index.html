<html lang="kn"><head><meta charset="utf-8"><link rel="canonical" href="https://mudgalapurana.com/sanskrit-kannada/index.html"><meta name="description" content="Read all nine khandas of the Mudgala Purana with Sanskrit verses in Kannada script and Kannada meanings."><meta name="viewport" content="width=device-width,initial-scale=1"><title>ಮುದ್ಗಲ ಪುರಾಣ · ಕನ್ನಡ ಆವೃತ್ತಿ</title><style>:root{font-family:"Noto Sans Kannada","Nirmala UI",system-ui,sans-serif;color:#503f36;background:#fbf7ed}body{margin:0}main,header{max-width:66rem;margin:auto;padding:1rem 1.3rem}h1,h2,a{color:#700d28}a{overflow-wrap:anywhere}nav a{display:inline-block;margin:.18rem;padding:.42rem .64rem;background:#f3e8d4;border-radius:.3rem}details{border-top:1px solid #d9c5a9;padding:.65rem 0}summary{cursor:pointer;font-weight:600;color:#700d28}iframe{width:100%;height:78vh;border:1px solid #d9c5a9}.note{background:#f8ecd9;padding:.7rem;border-radius:.3rem} a:focus-visible,summary:focus-visible{outline:2px solid #700d28}</style></head><body><header><p><a href="/">ಮುಖಪುಟ</a></p><h1>ಮುದ್ಗಲ ಪುರಾಣ · ಕನ್ನಡ ಆವೃತ್ತಿ</h1><p>ಒಂಬತ್ತು ಖಂಡಗಳು · ೪೨೮ ಅಧ್ಯಾಯಗಳು · ಸಂಸ್ಕೃತ ಶ್ಲೋಕಗಳು ಕನ್ನಡ ಲಿಪಿಯಲ್ಲಿ, ಜೊತೆಗೆ ಕನ್ನಡ ಅರ್ಥ.</p><nav aria-label="ಖಂಡಗಳು"><a href="khanda-1.html">ಖಂಡ ೧</a> <a href="khanda-2.html">ಖಂಡ ೨</a> <a href="khanda-3.html">ಖಂಡ ೩</a> <a href="khanda-4.html">ಖಂಡ ೪</a> <a href="khanda-5.html">ಖಂಡ ೫</a> <a href="khanda-6.html">ಖಂಡ ೬</a> <a href="khanda-7.html">ಖಂಡ ೭</a> <a href="khanda-8.html">ಖಂಡ ೮</a> <a href="khanda-9.html">ಖಂಡ ೯</a> </nav></header><main><p>ಓದಲು ಮೇಲಿನ ಖಂಡವನ್ನು ಆಯ್ಕೆಮಾಡಿ. ಮೂಲಪಾಠ ಅಥವಾ ಅರ್ಥ ಅಸ್ಪಷ್ಟವಾಗಿರುವ ಕಡೆ ಗುರುತುಗಳನ್ನು ಉಳಿಸಲಾಗಿದೆ.</p></main></body></html>
